name: Bug Report
description: Report a bug in Fluenti
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      placeholder: "@fluenti/core, @fluenti/vue, @fluenti/react, etc."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce or a minimal reproduction link
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version (run `pnpm list @fluenti/core`)
      placeholder: "0.3.4"
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Vue 3
        - React
        - SolidJS
        - Next.js
        - Nuxt 3
        - React Router
        - TanStack Start
        - SolidStart
        - Other
    validations:
      required: true
